name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The Android CLI and Lightbuild update independently of this repository.
  schedule:
    - cron: '23 6 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Lightbuild support in the Android CLI is gated behind this variable.
  ANDROID_CLI_BUILD: 'true'

jobs:
  build-and-unit-tests:
    name: Build + Unit Tests (Lightbuild)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android CLI
        run: |
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Android CLI diagnostics
        run: |
          android --version
          android info

      # Targets are named explicitly: a bare `android build` prints usage and builds nothing.
      - name: Build debug APK and the instrumentation APK
        run: |
          sh .github/scripts/android-build.sh "app:app-debug.apk"
          sh .github/scripts/android-build.sh "ui:deviceTest"

      - name: Astronomy engine unit tests (SGP4, Sun, Moon, planets, stars, passes, projection)
        run: sh .github/scripts/android-build.sh test "astro:hostTest"

      - name: UI unit tests (ViewModel, TLE repository, FOV, pose, debug extras)
        run: sh .github/scripts/android-build.sh test "ui:hostTest"

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            astro/build/intermediates/unit_test_results/
            ui/build/intermediates/unit_test_results/
            astro/build/reports/tests/
            ui/build/reports/tests/

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            ui/build/outputs/apk/androidTest/debug/ui-debug-androidTest.apk
          if-no-files-found: error

  release-build:
    name: Release Build (R8)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android CLI
        run: |
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build minified release APK
        run: sh .github/scripts/android-build.sh "app:app-release.apk"

      - name: Upload release APK and R8 mapping
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: |
            app/build/outputs/apk/release/
            app/build/outputs/mapping/release/
          if-no-files-found: error

  instrumented-tests:
    name: Instrumented Tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 34
            target: google_apis
          - api-level: 36
            target: google_apis
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android CLI
        run: |
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the APKs with Lightbuild
        run: |
          sh .github/scripts/android-build.sh "ui:deviceTest"
          sh .github/scripts/android-build.sh "app:app-debug.apk"
          sh .github/scripts/android-build.sh "app:app-release.apk"

      # The Lightbuild and Gradle caches plus the three APKs leave the runner with ~5 GB, and
      # the emulator refuses to start with less than the 7.3 GB its userdata partition needs
      # ("FATAL | Not enough space to create userdata partition"). Drop toolchains this job
      # never uses, and the build caches now that the APKs exist.
      - name: Free disk space for the emulator
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/julia* \
            "$AGENT_TOOLSDIRECTORY/go" || true
          rm -rf ~/.lightbuild/m2-cache ~/.gradle/caches .lightbuild/cache || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -1

      # The androidTest APK is self-instrumenting (library module). `am instrument -w` exits 0
      # even when tests fail, hence the explicit check for the "OK (N tests)" summary line.
      # Then the deterministic journey: launch the debug app with a frozen clock, a fixed
      # position and a fixed pose, and read the HUD and the objects list back with
      # `android layout`; finally smoke-launch the minified release APK (an R8 regression once
      # produced a release that crashed on launch while every build job stayed green).
      - name: Run instrumented tests and the sky journey
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            # A launcher ANR dialog on a loaded runner steals the window focus and once hid the
            # app from the journey's layout checks.
            adb shell settings put global hide_error_dialogs 1
            adb install -r ui/build/outputs/apk/androidTest/debug/ui-debug-androidTest.apk
            adb shell am instrument -w com.jpcottin.skylens.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee instrument_output.txt
            grep -q "OK (" instrument_output.txt
            sh .github/scripts/sky-journey.sh journey app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload journey evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sky-journey-api-${{ matrix.api-level }}
          path: |
            journey/
            instrument_output.txt
          if-no-files-found: warn
