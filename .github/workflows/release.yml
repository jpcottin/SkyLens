name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  ANDROID_CLI_BUILD: 'true'

jobs:
  release:
    name: Build release APK and publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android CLI
        run: |
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Unit tests
        run: |
          sh .github/scripts/android-build.sh test "astro:hostTest"
          sh .github/scripts/android-build.sh test "ui:hostTest"

      - name: Build minified release APK with Lightbuild
        run: sh .github/scripts/android-build.sh "app:app-release.apk"

      # Lightbuild writes an unsigned APK. GitHub-release builds are signed with a debug
      # keystore so the published file is installable; replace with a real keystore before any
      # store distribution.
      - name: Sign the release APK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(ls -d "$SDK"/build-tools/*/apksigner | sort -V | tail -1)"
          keytool -genkeypair -v -keystore release.keystore -storepass android -alias skylens -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SkyLens,O=jpcottin,C=CA"
          "$APKSIGNER" sign --ks release.keystore --ks-pass pass:android --ks-key-alias skylens --key-pass pass:android \
            --out "SkyLens-${GITHUB_REF_NAME}.apk" app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --print-certs "SkyLens-${GITHUB_REF_NAME}.apk" | head -3
          cp app/build/outputs/mapping/release/mapping.txt "SkyLens-${GITHUB_REF_NAME}-mapping.txt"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            SkyLens-*.apk
            SkyLens-*-mapping.txt
          generate_release_notes: true
